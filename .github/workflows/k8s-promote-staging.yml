name: k8s — Promote to Staging

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  promote-staging:
    name: Re-tag, sign, SBOM, and open GitOps PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute SHORT_SHA
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Re-tag web sha → staging
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/vyacheslavkozyrev/testurio-web:staging \
            ghcr.io/vyacheslavkozyrev/testurio-web:sha-${{ steps.sha.outputs.SHORT_SHA }}

      - name: Re-tag api sha → staging
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/vyacheslavkozyrev/testurio-api:staging \
            ghcr.io/vyacheslavkozyrev/testurio-api:sha-${{ steps.sha.outputs.SHORT_SHA }}

      - name: Re-tag worker sha → staging
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/vyacheslavkozyrev/testurio-worker:staging \
            ghcr.io/vyacheslavkozyrev/testurio-worker:sha-${{ steps.sha.outputs.SHORT_SHA }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign staging images (keyless OIDC)
        run: |
          cosign sign --yes ghcr.io/vyacheslavkozyrev/testurio-web:staging
          cosign sign --yes ghcr.io/vyacheslavkozyrev/testurio-api:staging
          cosign sign --yes ghcr.io/vyacheslavkozyrev/testurio-worker:staging

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate and attest SBOM — web
        run: |
          syft ghcr.io/vyacheslavkozyrev/testurio-web:staging -o spdx-json > web-sbom.spdx.json
          cosign attest --yes --predicate web-sbom.spdx.json --type spdxjson \
            ghcr.io/vyacheslavkozyrev/testurio-web:staging

      - name: Generate and attest SBOM — api
        run: |
          syft ghcr.io/vyacheslavkozyrev/testurio-api:staging -o spdx-json > api-sbom.spdx.json
          cosign attest --yes --predicate api-sbom.spdx.json --type spdxjson \
            ghcr.io/vyacheslavkozyrev/testurio-api:staging

      - name: Generate and attest SBOM — worker
        run: |
          syft ghcr.io/vyacheslavkozyrev/testurio-worker:staging -o spdx-json > worker-sbom.spdx.json
          cosign attest --yes --predicate worker-sbom.spdx.json --type spdxjson \
            ghcr.io/vyacheslavkozyrev/testurio-worker:staging

      - name: Open GitOps PR — bump staging image tag
        env:
          GH_TOKEN: ${{ secrets.GITOPS_PAT }}
        run: |
          SHORT_SHA=${{ steps.sha.outputs.SHORT_SHA }}
          gh pr create \
            --repo vyacheslavkozyrev/testurio-gitops \
            --title "chore: bump staging image tag to sha-${SHORT_SHA}" \
            --body "Automated promotion from develop. Image tag: sha-${SHORT_SHA}" \
            --base main \
            --head "staging/sha-${SHORT_SHA}" \
            || echo "GitOps PR step failed — image is signed and available. Re-run this job to retry."
