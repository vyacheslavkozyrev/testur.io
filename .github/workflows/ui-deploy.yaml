name: UI Deploy

on:
  push:
    tags:
      - "testurio-web@*"  # fired when release-please PAT-merges the Release PR

env:
  WORKING_DIR: source/Testurio.Web
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/testurio-web
  CHART_DIR: source/Testurio.Web/chart
  BASE_CHART_REPO: oci://ghcr.io/<org>/charts  # <-- replace with base chart registry path

permissions:
  contents: read
  packages: write   # push image and chart to GHCR
  id-token: write   # required for cosign keyless signing (optional)

jobs:
  build-and-push:
    name: Build Binary & Push Docker Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Strip component prefix from tag to get bare semver: testurio-web@1.3.0 → 1.3.0
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#testurio-web@}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      # Layer 1: node_modules cache — skips npm ci entirely on hit
      - name: Restore node_modules
        id: cache-node-modules
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.WORKING_DIR }}/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', env.WORKING_DIR)) }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Layer 2: Next.js incremental build cache — only recompiles changed files
      - name: Restore Next.js build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.WORKING_DIR }}/.next/cache
          # Full key: invalidates when deps or source changes
          key: nextjs-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', env.WORKING_DIR)) }}-${{ hashFiles(format('{0}/src/**', env.WORKING_DIR)) }}
          # Fallback: restore closest cache even if source changed — Next.js uses what's still valid
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', env.WORKING_DIR)) }}-

      - name: Build binary
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/Dockerfile.ci
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Layer 3: Docker layer cache stored in GHCR — persists across runs, no extra cost
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  scan:
    name: Scan Image for Vulnerabilities
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload SARIF to GitHub Security tab
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Install Trivy separately with caching — pinned version avoids supply chain risk
      # DO NOT use trivy-action@master — subject to supply chain attack (March 2026)
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          cache: true
          version: v0.63.0

      # Build image locally for scanning — Buildx doesn't load to Docker daemon by default
      # Reuses registry layer cache so this is fast (no re-download of layers)
      - name: Build image locally for scanning
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/Dockerfile.ci
          load: true   # loads into local Docker daemon, not pushed
          tags: scan-target:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache

      # Scan local image — no remote pull needed, no MANIFEST_UNKNOWN errors
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: scan-target:latest
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true   # ignore CVEs with no fix available
          skip-setup-trivy: true # already installed above

      # Upload to GitHub Security tab — visible under Security → Code scanning alerts
      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@f35333b910470a5408cb081b68f0701254a7d27b # v3.28.18
        if: always()  # upload even if scan found vulnerabilities
        with:
          sarif_file: trivy-results.sarif

      # Separate step that actually fails the build — after upload so results are always visible
      - name: Fail on vulnerabilities
        uses: aquasecurity/trivy-action@v0.31.0
        with:
          scan-type: image
          image-ref: scan-target:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          skip-setup-trivy: true

  sign-and-sbom:
    name: Sign Image & Generate SBOM
    needs: scan   # only runs if scan passes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # push signature and SBOM to GHCR
      id-token: write    # required for keyless cosign signing via OIDC
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sign by digest — immutable, not by mutable tag
      - name: Sign image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false  # we attach via cosign, not as a workflow artifact

      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
  
