name: UI Deploy

on:
  push:
    tags:
      - "testurio-web@*"  # fired when release-please PAT-merges the Release PR

env:
  WORKING_DIR: source/Testurio.Web
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/testurio-web
  CHART_REGISTRY_PATH: ${{ github.repository }}/testurio-web/charts
  CHART_DIR: source/Testurio.Web/chart
  BASE_CHART_REPO: oci://ghcr.io/northln/charts  # base chart registry

permissions:
  contents: read
  packages: write   # push image and chart to GHCR
  id-token: write   # required for cosign keyless signing

jobs:
  build-and-push:
    name: Build Binary & Push Docker Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Strip component prefix from tag to get bare semver: testurio-web@1.3.0 → 1.3.0
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#testurio-web@}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      # Layer 1: node_modules cache — skips npm ci entirely on hit
      - name: Restore node_modules
        id: cache-node-modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.WORKING_DIR }}/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', env.WORKING_DIR)) }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Layer 2: Next.js incremental build cache — only recompiles changed files
      - name: Restore Next.js build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.WORKING_DIR }}/.next/cache
          # Full key: invalidates when deps or source changes
          key: nextjs-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', env.WORKING_DIR)) }}-${{ hashFiles(format('{0}/src/**', env.WORKING_DIR)) }}
          # Fallback: restore closest cache even if source changed — Next.js uses what's still valid
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', env.WORKING_DIR)) }}-

      - name: Build binary
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE_URL: ${{secret.NEXT_PUBLIC_API_BASE_URL}} #https://api-dev01.testur.io
          NEXT_PUBLIC_B2C_TENANT: ${{ secrets.NEXT_PUBLIC_B2C_TENANT }}
          NEXT_PUBLIC_B2C_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_B2C_CLIENT_ID }}
          NEXT_PUBLIC_B2C_AUTHORITY: ${{ secrets.NEXT_PUBLIC_B2C_AUTHORITY }}
          NEXT_PUBLIC_B2C_KNOWN_AUTHORITY: ${{ secrets.NEXT_PUBLIC_B2C_KNOWN_AUTHORITY }}
          NEXT_PUBLIC_B2C_REDIRECT_URI: ${{ secrets.NEXT_PUBLIC_B2C_REDIRECT_URI }}
          NEXT_PUBLIC_B2C_SCOPES: ${{ secrets.NEXT_PUBLIC_B2C_SCOPES }}
          NEXT_PUBLIC_B2C_NATIVE_AUTH_URL: ${{ secrets.NEXT_PUBLIC_B2C_NATIVE_AUTH_URL }}
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/Dockerfile.ci
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Layer 3: Docker layer cache stored in GHCR — persists across runs, no extra cost
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  scan:
    name: Scan Image for Vulnerabilities
    needs: build-and-push
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ needs.build-and-push.outputs.digest }}
      version: ${{ needs.build-and-push.outputs.version }} 
    permissions:
      contents: read
      packages: read          # pull image from GHCR for scanning
      security-events: read  # use write when upload SARIF to GitHub Security tab is enabled
    steps:
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.0
        with:
          cache: true
          version: v0.70.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          format: table          # human readable in logs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1           # fail on findings
          skip-setup-trivy: true

     ##### When Advanced Security in GitHub gets enabled, use this ######
      # # Scan the already-pushed image directly by digest — immutable reference
      # # No rebuild needed — same image that was built and pushed in build-and-push job
      # - name: Scan image for vulnerabilities
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     scan-type: image
      #     image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
      #     format: sarif
      #     output: trivy-results.sarif
      #     severity: HIGH,CRITICAL
      #     ignore-unfixed: true
      #     skip-setup-trivy: true

      # # Upload always — results visible in Security tab even if scan fails the build
      # - name: Upload scan results to GitHub Security
      #   uses: github/codeql-action/upload-sarif@f52b05f4acaaa234e44466e66d29050e135ea9ef # v4.36.0
      #   if: always()
      #   with:
      #     sarif_file: trivy-results.sarif

      # # Separate failing step — after upload so results are always visible
      # - name: Fail build on HIGH/CRITICAL vulnerabilities
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     scan-type: image
      #     image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
      #     severity: HIGH,CRITICAL
      #     ignore-unfixed: true
      #     exit-code: 1
      #     skip-setup-trivy: true
      #######################################
          
  sign-and-sbom:
    name: Sign Image & Generate SBOM
    needs: scan   # only runs if scan passes
    outputs:
      version: ${{ needs.scan.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # push signature and SBOM to GHCR
      id-token: write    # required for keyless cosign signing via OIDC
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sign by digest — immutable, not by mutable tag
      - name: Sign image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.scan.outputs.digest }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.scan.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false  # we attach via cosign, not as a workflow artifact

      - name: Attest SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.scan.outputs.digest }}
  
  helm-lint:
    name: Helm Lint
    needs: sign-and-sbom
    outputs:
      version: ${{ needs.sign-and-sbom.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.0

      - name: Restore Helm dependencies
        id: cache-helm-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CHART_DIR }}/charts
          key: helm-deps-${{ runner.os }}-${{ hashFiles(format('{0}/Chart.lock', env.CHART_DIR)) }}

      - name: Debug dependency cache
        run: |
          echo "Cache hit: ${{ steps.cache-helm-deps.outputs.cache-hit }}"
          echo "Charts directory contents:"
          ls -la ${{ env.CHART_DIR }}/charts/ 2>/dev/null || echo "charts/ directory is empty or missing"

      - name: Log in to northln GHCR (base chart — only on cache miss)
        if: steps.cache-helm-deps.outputs.cache-hit != 'true'
        env:
          BASE_CHART_TOKEN: ${{ secrets.BASE_CHART_TOKEN }}
        run: |
          echo "${BASE_CHART_TOKEN}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin
      
      - name: Update dependencies (cache miss only)
        if: steps.cache-helm-deps.outputs.cache-hit != 'true'
        run: |
          helm dependency update ${{ env.CHART_DIR }}
          echo "Downloaded charts:"
          ls -la ${{ env.CHART_DIR }}/charts/

      # - name: Build dependencies from cache (cache hit)
      #   if: steps.cache-helm-deps.outputs.cache-hit == 'true'
      #   run: helm dependency build ${{ env.CHART_DIR }}

      - name: Lint chart
        run: helm lint ${{ env.CHART_DIR }}

  
  package-chart:
    name: Package & Push Helm Chart
    needs: helm-lint
    outputs:
      version: ${{ needs.helm-lint.outputs.version }} 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Pin Helm version — enables GitHub tool cache reuse across runs
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.0

      - name: Update Chart.yaml versions
        run: |
          VERSION="${{ needs.helm-lint.outputs.version }}"
          sed -i "s/^appVersion:.*$/appVersion: \"${VERSION}\"/" ${{ env.CHART_DIR }}/Chart.yaml
          sed -i "s/^version:.*$/version: ${VERSION}/" ${{ env.CHART_DIR }}/Chart.yaml

      - name: Update image tag in values
        run: |
          VERSION="${{ needs.helm-lint.outputs.version }}"
          sed -i "s/^\(\s*tag:\s*\).*$/\1\"${VERSION}\"/" ${{ env.CHART_DIR }}/values.yaml

      - name: Verify chart version updates
        run: |
          echo "Chart.yaml versions:"
          grep -E "^version:|^appVersion:" ${{ env.CHART_DIR }}/Chart.yaml
          echo "values.yaml image tag:"
          grep "tag:" ${{ env.CHART_DIR }}/values.yaml

      # Layer 4: Helm chart dependencies — avoids re-pulling base chart on every run
      - name: Restore Helm dependencies
        id: cache-helm-deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CHART_DIR }}/charts
          key: helm-deps-${{ runner.os }}-${{ hashFiles(format('{0}/Chart.lock', env.CHART_DIR)) }}

      - name: Debug dependency cache
        run: |
          echo "Cache hit: ${{ steps.cache-helm-deps.outputs.cache-hit }}"
          echo "Charts directory contents:"
          ls -la ${{ env.CHART_DIR }}/charts/ 2>/dev/null || echo "charts/ directory is empty or missing"

      - name: Log in to northln GHCR (base chart — only on cache miss)
        if: steps.cache-helm-deps.outputs.cache-hit != 'true'
        env:
          BASE_CHART_TOKEN: ${{ secrets.BASE_CHART_TOKEN }}
        run: |
          echo "${BASE_CHART_TOKEN}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Download dependencies
        if: steps.cache-helm-deps.outputs.cache-hit != 'true'
        run: |
          helm dependency update ${{ env.CHART_DIR }}
          echo "Downloaded charts:"
          ls -la ${{ env.CHART_DIR }}/charts/
      
      # - name: Build dependencies from cache (cache hit)
      #   if: steps.cache-helm-deps.outputs.cache-hit == 'true'
      #   run: helm dependency build ${{ env.CHART_DIR }}

      - name: Package Helm chart
        run: |
          helm package ${{ env.CHART_DIR }} --destination /tmp/chart-output
          echo "Packaged chart:"
          ls -la /tmp/chart-output/

      # Re-login with vyacheslavkozyrev token for pushing
      - name: Log in to GHCR (push)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Push Helm chart to GHCR
        run: |
          helm push /tmp/chart-output/*.tgz \
            oci://${{ env.REGISTRY }}/${{ env.CHART_REGISTRY_PATH }}
          echo "Chart pushed to oci://${{ env.REGISTRY }}/${{ env.CHART_REGISTRY_PATH }}"

  update-gitops:
    name: Update GitOps Repo
    needs: package-chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.2.2 
        with:
          repository: northLn/k3s-local
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
          ref: feature/argocd 

      - name: Create deploy branch
        run: |
          VERSION="${{ needs.package-chart.outputs.version }}"
          cd gitops
          git checkout -b "deploy/testurio-web-${VERSION}"

      - name: Update dev values
        run: |
          VERSION="${{ needs.package-chart.outputs.version }}"
          sed -i "s/^\(\s*chartVersion:\s*\).*$/\1\"${VERSION}\"/" \
            gitops/argocd/clusters/dev01/workload/testurio-web/service.yaml

      - name: Verify service.yaml update
        run: |
          echo "service.yaml after update:"
          cat gitops/argocd/clusters/dev01/workload/testurio-web/service.yaml

      - name: Commit and push
        run: |
          VERSION="${{ needs.package-chart.outputs.version }}"
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit \
            -m "chore(testurio-web): bump chart and image to ${VERSION}"
          git push origin "deploy/testurio-web-${VERSION}"

      - name: Open PR in GitOps repo
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          VERSION="${{ needs.package-chart.outputs.version }}"
          gh pr create \
            --title "chore(testurio-web): deploy ${VERSION} to dev" \
            --body "Automated chart and image bump for testurio-web ${VERSION}" \
            --base feature/argocd \
            --head "deploy/testurio-web-${VERSION}" \
            --repo northLn/k3s-local

      # Auto-merge for dev (Phase 1)
      # Replace with manual approval gate in Phase 2/3 for stg/prd
      - name: Auto-merge GitOps PR
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          VERSION="${{ needs.package-chart.outputs.version }}"
          gh pr merge \
            --delete-branch \
            --squash \
            "deploy/testurio-web-${VERSION}" \
            --repo northLn/k3s-local
