name: UI Deploy

on:
  push:
    tags:
      - "testurio-web@*"  # fired when release-please PAT-merges the Release PR

env:
  WORKING_DIR: source/Testurio.Web
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/testurio-web
  CHART_DIR: source/Testurio.Web/chart
  BASE_CHART_REPO: oci://ghcr.io/<org>/charts  # <-- replace with base chart registry path

permissions:
  contents: read
  packages: write   # push image and chart to GHCR
  id-token: write   # required for cosign keyless signing (optional)

jobs:
  build-and-push:
    name: Build Binary & Push Docker Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Strip component prefix from tag to get bare semver: testurio-web@1.3.0 → 1.3.0
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#testurio-web@}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      # Layer 1: node_modules cache — skips npm ci entirely on hit
      - name: Restore node_modules
        id: cache-node-modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.WORKING_DIR }}/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', env.WORKING_DIR)) }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # Layer 2: Next.js incremental build cache — only recompiles changed files
      - name: Restore Next.js build cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.WORKING_DIR }}/.next/cache
          # Full key: invalidates when deps or source changes
          key: nextjs-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', env.WORKING_DIR)) }}-${{ hashFiles(format('{0}/src/**', env.WORKING_DIR)) }}
          # Fallback: restore closest cache even if source changed — Next.js uses what's still valid
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles(format('{0}/package-lock.json', env.WORKING_DIR)) }}-

      - name: Build binary
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/Dockerfile.ci
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Layer 3: Docker layer cache stored in GHCR — persists across runs, no extra cost
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  scan:
    name: Scan Image for Vulnerabilities
    needs: build-and-push
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ needs.build-and-push.outputs.digest }}
    permissions:
      contents: read
      packages: read          # pull image from GHCR for scanning
      security-events: read  # use write when upload SARIF to GitHub Security tab is enabled
    steps:
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          cache: true
          version: v0.70.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          format: table          # human readable in logs
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1           # fail on findings
          skip-setup-trivy: true

     ##### When Advanced Security in GitHub gets enabled, use this ######
