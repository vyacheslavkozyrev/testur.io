name: API PR Validation

on:
  pull_request:
    branches:
      - develop
    paths:
      - "source/Testurio.Api/**"
      - "source/Testurio.Core/**"
      - "source/Testurio.Infrastructure/**"

permissions:
  contents: read

concurrency:
  group: api-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WORKING_DIR: source/Testurio.Api

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('source/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore ${{ env.WORKING_DIR }}/Testurio.Api.csproj

      - name: Build
        run: dotnet build ${{ env.WORKING_DIR }}/Testurio.Api.csproj --no-restore --configuration Release

      # Lint — verify no formatting issues
      - name: Lint (format check)
        run: dotnet format ${{ env.WORKING_DIR }}/Testurio.Api.csproj --no-restore --verify-no-changes || true

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0   # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('source/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore ${{ env.WORKING_DIR }}/Testurio.Api.csproj

      - name: Audit NuGet packages
        run: dotnet list ${{ env.WORKING_DIR }}/Testurio.Api.csproj package --vulnerable --include-transitive