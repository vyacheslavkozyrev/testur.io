name: API PR Validation

on:
  pull_request:
    branches:
      - develop
    paths:
      - "source/Testurio.Api/**"
      - "source/Testurio.Core/**"
      - "source/Testurio.Infrastructure/**"

permissions:
  contents: read

concurrency:
  group: api-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WORKING_DIR: source/Testurio.Api

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10   # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('source/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore ${{ env.WORKING_DIR }}/Testurio.Api.csproj

      - name: Build
        run: dotnet build ${{ env.WORKING_DIR }}/Testurio.Api.csproj --no-restore --configuration Release

      # Lint — verify no formatting issues
      - name: Lint (format check)
        run: dotnet format ${{ env.WORKING_DIR }}/Testurio.Api.csproj --no-restore --verify-no-changes || true

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10   # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('source/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore ${{ env.WORKING_DIR }}/Testurio.Api.csproj

      - name: Audit NuGet packages
        run: dotnet list ${{ env.WORKING_DIR }}/Testurio.Api.csproj package --vulnerable --include-transitive