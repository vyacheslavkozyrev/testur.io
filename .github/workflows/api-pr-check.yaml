name: API PR Validation

on:
  pull_request:
    branches:
      - develop
    paths:
      - "source/Testurio.Api/**"
      - "source/Testurio.Core/**"
      - "source/Testurio.Infrastructure/**"

permissions:
  contents: read

concurrency:
  group: api-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WORKING_DIR: source/Testurio.Api

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('source/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore ${{ env.WORKING_DIR }}/Testurio.Api.csproj

      - name: Build
        run: dotnet build ${{ env.WORKING_DIR }}/Testurio.Api.csproj \
          --no-restore \
          --configuration Release

      # Lint — verify no formatting issues
      - name: Lint (format check)
        run: dotnet format ${{ env.WORKING_DIR }}/Testurio.Api.csproj \
          --no-restore \
          --verify-no-changes || true

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd   # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('source/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore ${{ env.WORKING_DIR }}/Testurio.Api.csproj

      - name: Audit NuGet packages
        run: dotnet list ${{ env.WORKING_DIR }}/Testurio.Api.csproj package \
          --vulnerable \
          --include-transitive