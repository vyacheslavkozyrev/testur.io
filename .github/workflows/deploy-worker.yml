name: Deploy Worker (Container Apps)

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'source/Testurio.Worker/**'
      - 'source/Testurio.Core/**'
      - 'source/Testurio.Infrastructure/**'
      - 'source/Testurio.Pipeline.**/**'
      - 'source/Testurio.Plugins/**'
      - '.github/workflows/deploy-worker.yml'

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

jobs:
  deploy:
    name: Build and push Worker image, update Container App revision
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_LOGIN_SERVER }}"

      - name: Set image tag
        id: image-tag
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          IMAGE="${{ vars.ACR_LOGIN_SERVER }}/testurio-worker:${{ steps.image-tag.outputs.tag }}"
          docker build \
            --file source/Testurio.Worker/Dockerfile \
            --tag "$IMAGE" \
            .
          docker push "$IMAGE"

      - name: Update Container App with new image
        run: |
          az containerapp update \
            --name "${{ vars.WORKER_APP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_LOGIN_SERVER }}/testurio-worker:${{ steps.image-tag.outputs.tag }}"
