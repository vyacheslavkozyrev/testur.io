name: Deploy API (App Service)

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'source/Testurio.Api/**'
      - 'source/Testurio.Core/**'
      - 'source/Testurio.Infrastructure/**'
      - '.github/workflows/deploy-api.yml'

permissions:
  id-token: write   # required for OIDC token exchange
  contents: read

jobs:
  deploy:
    name: Build and deploy ASP.NET Core API to App Service
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore source/Testurio.Api/Testurio.Api.csproj

      - name: Publish
        run: |
          dotnet publish source/Testurio.Api/Testurio.Api.csproj \
            -c Release \
            -o ./publish \
            --no-restore

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.APP_SERVICE_NAME }}
          package: ./publish
