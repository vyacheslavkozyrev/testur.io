name: k8s — PR Build, Lint, Test, and Push

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: source/Testurio.Web/node_modules
          key: npm-${{ hashFiles('source/Testurio.Web/package-lock.json') }}
          restore-keys: npm-

      - name: npm ci
        working-directory: source/Testurio.Web
        run: npm ci

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: dotnet restore
        run: dotnet restore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: source/Testurio.Web/node_modules
          key: npm-${{ hashFiles('source/Testurio.Web/package-lock.json') }}

      - name: npm run lint
        working-directory: source/Testurio.Web
        run: npm run lint

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}

      - name: dotnet format --verify-no-changes
        run: dotnet format --verify-no-changes

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: source/Testurio.Web/node_modules
          key: npm-${{ hashFiles('source/Testurio.Web/package-lock.json') }}

      - name: npm test
        working-directory: source/Testurio.Web
        run: npm test -- --watchAll=false

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}

      - name: dotnet test
        run: dotnet test tests/Testurio.UnitTests/

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      SHORT_SHA: ${{ steps.sha.outputs.SHORT_SHA }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute SHORT_SHA
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: source/Testurio.Web/Dockerfile
          push: true
          tags: ghcr.io/vyacheslavkozyrev/testurio-web:sha-${{ steps.sha.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: source/Testurio.Api/Dockerfile
          push: true
          tags: ghcr.io/vyacheslavkozyrev/testurio-api:sha-${{ steps.sha.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: source/Testurio.Worker/Dockerfile
          push: true
          tags: ghcr.io/vyacheslavkozyrev/testurio-worker:sha-${{ steps.sha.outputs.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
