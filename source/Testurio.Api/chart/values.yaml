# testurio-api chart values
# All overrides go under the base-chart: key — see base-chart README for full reference

base-chart:
  fullnameOverride: testurio-api

  # ── Image ──────────────────────────────────────────────────────
  image:
    repository: ghcr.io/vyacheslavkozyrev/testur.io/testurio-api
    pullPolicy: IfNotPresent
    # tag defaults to .Chart.AppVersion — set explicitly in CI via --set image.tag=<version>
    tag: ""

  # GHCR is private — pull secret must exist in the target namespace
  # Create with: kubectl create secret docker-registry ghcr-pull-secret \
  #   --docker-server=ghcr.io \
  #   --docker-username=vyacheslavkozyrev \
  #   --docker-password=YOUR_PAT \
  #   --namespace=<namespace>
  imagePullSecrets:
    - name: ghcr-pull-secret

  # ── Service ────────────────────────────────────────────────────
  service:
    type: ClusterIP
    port: 8080

  # ── Security context ───────────────────────────────────────────
  # Override base defaults to match aspnet built-in APP_UID (1654)
  # readOnlyRootFilesystem: false — .NET runtime requires writable filesystem
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1654
    runAsGroup: 1654
    fsGroup: 1654
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false  # .NET runtime writes temp files — cannot be true
    runAsNonRoot: true
    runAsUser: 1654
    runAsGroup: 1654
    privileged: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # ── Probes — disabled until health endpoint is implemented ─────
  # Enable when /health or /ready endpoint is added to the API:
  # livenessProbe:
  #   enabled: true
  #   httpGet:
  #     path: /health
  #     port: http
  # readinessProbe:
  #   enabled: true
  #   httpGet:
  #     path: /health
  #     port: http
  # startupProbe:
  #   enabled: true
  #   httpGet:
  #     path: /health
  #     port: http
  #   failureThreshold: 30
  #   periodSeconds: 10
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false
  startupProbe:
    enabled: false

  # ── Resources — sized for k3s ──────────────────────────────────
  resources:
    limits:
      memory: 512Mi     # .NET runtime needs more than 128Mi default
    requests:
      cpu: 100m
      memory: 256Mi

  # ── Gateway API (Cilium) ───────────────────────────────────────
  httpRoute:
    enabled: true
    parentRefs:
      - name: cilium-gateway
        sectionName: https
    hostnames:
      - api-dev01.testur.io
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /

  # ── Ingress — disabled, using Gateway API instead ─────────────
  ingress:
    enabled: false

  # kubectl create secret generic testurio-api-b2c \
  # --from-literal=authority="https://testuriob2cdevelop.ciamlogin.com/YOUR_TENANT/v2.0" \
  # --from-literal=clientId="YOUR_CLIENT_ID" \
  # --namespace=dev01-testurio
  #
  # kubectl create secret generic testurio-api-azure-sp \
  # --from-literal=tenantId="YOUR_AZURE_TENANT_ID" \
  # --from-literal=clientId="YOUR_AZURE_CLIENT_ID" \
  # --from-literal=clientSecret="YOUR_AZURE_CLIENT_SECRET" \
  # --namespace=dev01-testurio
  # ── Environment variables ──────────────────────────────────────
  extraEnv:
    - name: DOTNET_ENVIRONMENT
      value: Develop
    - name: ASPNETCORE_URLS
      value: "http://+:8080"
    - name: AzureAdB2C__Authority
      valueFrom:
        secretKeyRef:
          name: testurio-api-b2c
          key: authority
    - name: AzureAdB2C__ClientId
      valueFrom:
        secretKeyRef:
          name: testurio-api-b2c
          key: clientId
    - name: AZURE_TENANT_ID
      valueFrom:
        secretKeyRef:
          name: testurio-api-azure-sp
          key: tenantId
    - name: AZURE_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: testurio-api-azure-sp
          key: clientId
    - name: AZURE_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: testurio-api-azure-sp
          key: clientSecret
    - name: Infrastructure__CosmosDatabaseName
      value: testurio-dev
    - name: Infrastructure__TestRunJobQueueName
      value: story-test-pipeline
    - name: Infrastructure__RunStatusChangedQueueName
      value: run-status-changed
    - name: Infrastructure__CommentEventTopicName
      value: testurio-comment-events
    - name: Infrastructure__CommentEventSubscriptionName
      value: worker
    - name: Infrastructure__ExecutionLogsBlobContainerName
      value: execution-logs
    - name: Infrastructure__ReportTemplatesBlobContainerName
      value: report-templates
    - name: Infrastructure__ReportsBlobContainerName
      value: test-reports
    - name: App__BaseUrl
      value: https://web-dev01.testur.io
    - name: PMTool__ApiBaseUrl
      value: https://api-dev01.testur.io
    - name: Stripe__PriceIds__TestJunior_Monthly
      value: price_1TYu2y08x3ytd9CGx4bNOfBy
    - name: Stripe__PriceIds__TestJunior_Annual
      value: price_1TYu3L08x3ytd9CG1AzpJ4W1
    - name: Stripe__PriceIds__TestPro_Monthly
      value: price_1TYqEW08x3ytd9CGWQDaPUvg
    - name: Stripe__PriceIds__TestPro_Annual
      value: price_1TYqEW08x3ytd9CGPWNyvLaR
    - name: Stripe__PriceIds__Team_Monthly
      value: price_1TYqEW08x3ytd9CGV26fSLti
    - name: Stripe__PriceIds__Team_Annual
      value: price_1TYqEW08x3ytd9CG0mjHAvGc
    - name: Stripe__PriceIds__Centurio_Monthly
      value: price_1TYqEW08x3ytd9CG7fATYogc
    - name: Stripe__PriceIds__Centurio_Annual
      value: price_1TYq8u08x3ytd9CGGBgqEK4E

  # ── Autoscaling — disabled for now ────────────────────────────
  autoscaling:
    enabled: false

  # ── Pod disruption budget — disabled for single replica ───────
  podDisruptionBudget:
    enabled: false