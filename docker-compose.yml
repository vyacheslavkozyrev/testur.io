name: testurio

services:
  api:
    build:
      context: .
      dockerfile: source/Testurio.Api/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DOTNET_ENVIRONMENT: Production
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: source/Testurio.Worker/Dockerfile
    env_file:
      - .env
    environment:
      DOTNET_ENVIRONMENT: Production
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: source/Testurio.Web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
